name = "zmk"
source = { editable = "." }
dependencies = [
    { name = "dacite" },
    { name = "giturlparse" },
    { name = "mako" },
    { name = "rich" },
    { name = "ruamel-yaml" },
    { name = "shellingham" },
    { name = "typer" },
    { name = "west" },
]

[package.dev-dependencies]
dev = [
    { name = "prek" },
    { name = "pyright" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "dacite", specifier = ">=1.9.2,<2.0.0" },
    { name = "giturlparse", specifier = ">=0.15.0,<0.16.0" },
    { name = "mako", specifier = ">=1.4.1,<2.0.0" },
    { name = "rich", specifier = ">=15.0.0,<16.0.0" },
    { name = "ruamel-yaml", specifier = ">=0.19.1,<0.20.0" },
    { name = "shellingham", specifier = ">=1.5.4,<2.0.0" },
    { name = "typer", specifier = ">=0.27.2,<0.28.0" },
    { name = "west", specifier = ">=1.5.0,<2.0.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "prek", specifier = ">=0.5.3" },
    { name = "pyright", specifier = ">=1.1.414" },
    { name = "ruff", specifier = ">=0.16.8" },
]
